version: "3.9"

services:

  # ---------------------------------------------------------------
  # Redis - Message broker + result backend for Celery
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pdf_twin_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------
  # FastAPI - REST API server
  # ---------------------------------------------------------------
  api:
    build: .
    container_name: pdf_twin_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
      - /tmp/pdf_twin_uploads:/tmp/pdf_twin_uploads
      - /tmp/pdf_twin_outputs:/tmp/pdf_twin_outputs
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------
  # Celery Worker - Background job processor
  # ---------------------------------------------------------------
  worker:
    build: .
    container_name: pdf_twin_worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --queues=pdf_processing --concurrency=2
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
      - /tmp/pdf_twin_uploads:/tmp/pdf_twin_uploads
      - /tmp/pdf_twin_outputs:/tmp/pdf_twin_outputs
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pdf_twin_uploads:
  pdf_twin_outputs: